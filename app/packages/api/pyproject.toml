[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redactlens-api"
version = "0.1.0"
description = "Thin local-only FastAPI backend over redactlens-core. No detection logic lives here."
requires-python = ">=3.11"
classifiers = [
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "redactlens-core",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx2>=2,<3",
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["redactlens_api"]
