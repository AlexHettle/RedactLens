[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redactlens-core"
version = "0.1.0"
description = "Local-first sensitive-data detection engine for RedactLens. UI-independent; no web/UI dependencies."
requires-python = ">=3.11"
classifiers = [
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "ollama>=0.3,<1",
    # Used directly for unfiltered /api/show model-origin verification.
    "httpx>=0.27,<1",
    # stdlib re cannot preempt catastrophic configurable expressions. regex
    # provides an engine-level execution deadline.
    "regex>=2024.11,<2027",
    # Binary-document extraction (Phase A): both pure-Python, offline.
    "pypdf>=5,<7",
    "defusedxml>=0.7,<1",
    # Document write-back (Phase B): lxml preserves the original namespace
    # prefixes on roundtrip, which stdlib ElementTree does not — rewritten
    # prefixes can break Word files whose mc:Ignorable references them.
    "lxml>=5,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["redactlens_core"]
