id: high_entropy_secret
category: credential
description: "High-entropy token (possible API key or secret with no known format)"
risk_lesson: "A long, random-looking string is often an API key or access token; if leaked, it can be used to impersonate this application or run up charges on your account."
method: entropy
pattern: '\b[A-Za-z0-9+/_=-]{20,64}\b'
entropy_threshold: 4.0
base_confidence: 0.65
specificity: 10
context:
  boosters:
    - { pattern: '(?i)key|token|secret|api', weight: +0.15 }
  suppressors:
    - { pattern: '(?i)\b(examples?|tests?|samples?|fakes?)\b', weight: -0.40 }
    - { in_path: '(?i)\b(test|fixtures?|samples?)\b', weight: -0.30 }
