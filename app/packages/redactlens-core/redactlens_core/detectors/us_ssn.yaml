id: us_ssn
category: personal_id
description: "U.S. Social Security Number"
risk_lesson: "An SSN can be used for identity theft and to open accounts in your name."
method: regex
pattern: '\b\d{3}-\d{2}-\d{4}\b'
base_confidence: 0.85
specificity: 90
context:
  boosters:
    - { pattern: '(?i)ssn|social security', weight: +0.10 }
  suppressors:
    - { pattern: '(?i)\b(examples?|tests?|samples?|fakes?)\b', weight: -0.40 }
    - { pattern: '(?i)\b(migration|legacy report|not a person)\b', weight: -0.40 }
    - { in_path: '(?i)\b(test|fixtures?|samples?)\b', weight: -0.30 }
