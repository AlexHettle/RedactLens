id: password_assignment
category: credential
description: "Hard-coded password or secret assignment"
risk_lesson: "A hard-coded password in source or config can be read by anyone with file access and reused to gain unauthorized access."
method: regex
pattern: '(?i)\b\w{0,64}(?:password|passwd|pwd|secret)\w{0,64}\s{0,32}[:=]\s{0,32}(?P<value>[^\s,;]{4,4096})'
max_match_length: 4300
base_confidence: 0.80
specificity: 80
suppresses: [high_entropy_secret]
context:
  boosters:
    - { pattern: '(?i)prod|production|live', weight: +0.15 }
  suppressors:
    - { pattern: '(?i)\b(examples?|tests?|samples?|fakes?)\b', weight: -0.40 }
    - { pattern: '(?i)\b(placeholders?|replace[- ]before[- ]use)\b', weight: -0.40 }
    - { in_path: '(?i)\b(test|fixtures?|samples?)\b', weight: -0.30 }
