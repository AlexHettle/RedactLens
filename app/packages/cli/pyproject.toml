[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redactlens-cli"
version = "0.1.0"
description = "Thin Typer CLI over redactlens-core. No detection logic lives here."
requires-python = ">=3.11"
classifiers = [
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "redactlens-core",
    "typer>=0.12,<1",
]

[project.scripts]
redactlens = "redactlens_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["redactlens_cli"]
