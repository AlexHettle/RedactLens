[project]
name = "redactlens-eval"
version = "0.1.0"
description = "Deterministic calibration/holdout evaluation harness for redactlens-core."
requires-python = ">=3.11"
classifiers = [
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "redactlens-core",
    "python-docx>=1.1,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=1,<2",
    "odfpy>=1.4,<2",
]
